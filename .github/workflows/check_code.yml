name: GWForge CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: mamba-org/setup-micromamba@v1
      with:
        environment-file: environment.yaml
        cache-environment: true

    - name: Install package
      shell: bash -l {0}
      run: |
        pip install -e .
      
    - name: Ruff check
      shell: bash -l {0}
      run: ruff check .

    - name: Forbid np and plt
      shell: bash -l {0}
      run: |
        if grep -REn "^[[:space:]]*(import numpy as np|import matplotlib.pyplot as plt|from matplotlib import pyplot as plt)$" GWForge bin; then
          echo "Forbidden shorthand imports found. Use numpy and pylab."
          exit 1
        fi

    - name: Run tests
      shell: bash -l {0}
      run: pytest