repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        args: ["--fix"]

  - repo: local
    hooks:
      - id: forbid-np-plt
        name: forbid numpy/pyplot shorthand
        # GWForge spells these out in full: `import numpy` and `import pylab`.
        # Match the import statements themselves rather than every `np.` /
        # `plt.` substring: the old rule also pointed at a path that does not
        # exist (`gwforge`, not `GWForge`), so it never actually ran.
        # Keep this identical to the "Forbid np and plt" step in
        # .github/workflows/check_code.yml. `\b` rather than `$` so a trailing
        # `# noqa` or a CRLF line ending cannot slip past.
        entry: >
          bash -c 'if grep -REn --exclude-dir=__pycache__ "^[[:space:]]*(import numpy as np|import matplotlib\.pyplot as plt|from matplotlib import pyplot as plt)\b" GWForge bin tests __init__.py; then
                   echo "Forbidden shorthand imports found. Use numpy and pylab.";
                   exit 1;
                   fi'
        language: system
        pass_filenames: false
        # Not `files: \.py$`: the scripts under bin/ have no extension, so a
        # commit touching only bin/ would never trigger the hook.
        always_run: true
