# Blip and tomte glitches as sine-Gaussians, calibrated on the public Gravity Spy
# O3a Omicron tables (Zenodo 5649212, ml_confidence >= 0.9) and the literature
# cited below. Every section other than [IFOS] is one glitch class. Rates are per
# hour per detector and may be a per-detector dict, e.g. {'CE40': 1.3, 'ET1': 0.65}.
# The SNR is the optimal SNR against each detector's PSD and follows
# p(snr) ~ snr**-snr-index on snr-range; the Gravity Spy indices below are LIGO
# Omicron SNRs above the 7.5 detection threshold, so the range here extends well
# below and above them. Set snr-index = 1 for a log-uniform (louder) population.
[IFOS]
detectors = ['CE20', 'CE40', 'ET']

[Blip]
# Short broadband bursts, duration O(10) ms (Cabero et al. 2019, arXiv:1901.05093).
# Gravity Spy O3a: peak frequency 93-412 Hz at H1 (median 176), 111-630 Hz at L1
# (median 269); 1.3/h at H1, 0.65/h at L1; SNR power-law index 2.2-2.4.
# A 10 ms burst at 200 Hz has Q = sqrt(2) pi f0 tau ~ 2-6. Blips are symmetric
# in time with phase 0 or pi (Antiglitch, arXiv:2309.06594).
rate = 1
frequency-range = [50, 500]
q-range = [2, 6]
snr-range = [5, 200]
snr-index = 2.3
phases = [0, 3.141592653589793]
seed = 0

[Tomte]
# Triangular bursts of ~0.25 s with most power below 64 Hz (Glanzer et al. 2023,
# arXiv:2208.12849). Gravity Spy O3a: peak frequency 32-61 Hz (median 40);
# 6.2/h at L1, 0.22/h at H1; SNR power-law index 2.0-2.4. A 0.2 s burst at
# 40 Hz has Q ~ 4-12. Tomtes are symmetric with phase pi (Antiglitch).
rate = 3
frequency-range = [30, 65]
q-range = [4, 12]
snr-range = [5, 200]
snr-index = 2.2
phases = [3.141592653589793]
seed = 0
