; Analysis 5: spectral sirens -- the full population plus (H0, Om0, w0).
;
; Adding 'cosmology' to the blocks switches the model from a source-frame
; product to the detector-frame SpectralSirenModel, whose density is over the
; observables (m1_det, m2_det, dL). That is what keeps P_det free of
; hyper-parameters, and hence the centred-score selection term exact.
;
; Pin w0 for a LCDM forecast, or w0 and Om0 for H0 alone, via fixed-parameters.
[Catalogue]
population-file = bbh_population.h5
snr-file = bbh_snr.h5
detectors = ['CE40', 'CE20', 'ET']
snr-thresholds = [10, 20]

[Model]
; Must match the generation config: a different support is a different model.
maximum-redshift = 10
cosmology = Planck18
mmin = 4.489078237
m-high = 300.0
maximum-mass = 300.0
mass-parameters = {'alpha_1': 1.456442737, 'alpha_2': 5.100400428, 'm_break': 37.9806382, 'lam_0': 0.4206178692, 'lam_1': 0.5228817702, 'mpp_1': 9.989384122, 'sigpp_1': 0.6601839103, 'mpp_2': 33.2656028, 'sigpp_2': 4.582221363, 'delta_m': 3.123416382, 'beta': 0.8049660633}
redshift-parameters = {'gamma': 2.7, 'kappa': 5.6, 'z_peak': 1.9}
spin-parameters = {'mu_chi': 0.0751318233, 'sigma_chi': 0.3667469243, 'mu_t': 0.2788662234, 'sigma_t': 0.9661688072, 'xi_spin': 0.6650168221}
blocks = ['mass', 'redshift', 'cosmology']
cosmology-parameters = ['H0', 'Om0', 'w0']

[Fit]
fit-redshift = True
fit-mass = True

[Fisher]
; mmin, m_high and maximum_mass are not hyper-parameters here at all -- they are
; hard cutoffs whose centred scores vanish identically, so they are set by
; construction in [Model]. See GWForge.population_fisher.model.
;
; delta_m is a hyper-parameter of the model but is held at its generation value.
; It is the width of the low-mass taper: a sharp feature at a *fixed source-frame
; mass*, i.e. a standard scale, so of every mass parameter it is the one that
; feeds H0 most directly. Freeing it in a spectral-siren fit lets the taper
; absorb the cosmology, and sigma(H0) then reports a degeneracy rather than a
; measurement. Scan it by running the forecast at several values instead.
;
; m_break IS free. It is a mass scale too, and correspondingly correlated with
; H0, but it is a feature of the spectrum the catalogue genuinely constrains --
; pinning it would flatter the forecast.
;
; Omitting a name here fixes it at its config value and the summary says so.
free-parameters = ['alpha_1', 'alpha_2', 'm_break', 'lam_0', 'lam_1', 'mpp_1', 'sigpp_1', 'mpp_2', 'sigpp_2', 'beta', 'gamma', 'kappa', 'z_peak', 'H0', 'Om0', 'w0']
; The degeneracy ladder: what separates two published sigma(H0) values is
; usually which of these rungs they quoted, not the physics.
configurations = {'joint': {}, 'lcdm': {'w0': -1.0}, 'h0_only': {'Om0': 0.3111, 'w0': -1.0}}
score-method = analytic

[Output]
output-directory = population_fisher_output
label = spectral_siren
plot-corner = True
; A 16-parameter corner is 256 panels and legible in none of them. These are the
; cosmology plus what it actually trades against, measured rather than guessed:
; on a one-year CE40+CE20+ET catalogue corr(H0, w0) = -0.91, corr(H0, Om0) =
; -0.90, then corr(H0, mpp_1) = -0.59. mpp_1 is the narrow ~10 Msun peak -- a
; sharp feature at a fixed source-frame mass, i.e. the standard scale the whole
; spectral-siren measurement rests on. The broad 33 Msun peak reaches only -0.23.
plot-parameters = ['H0', 'Om0', 'w0', 'mpp_1', 'kappa', 'z_peak']
