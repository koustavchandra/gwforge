; Analysis 4: mass, redshift and spins.
[Catalogue]
population-file = bbh_population.h5
snr-file = snr_xg.h5
detectors = ['CE40', 'CE20', 'ET']
snr-thresholds = [10, 20]

[Model]
; Must match the generation config: a different support is a different model.
maximum-redshift = 10
cosmology = Planck18
mmin = 4.489078237
m-high = 300.0
maximum-mass = 300.0
mass-parameters = {'alpha_1': 1.456442737, 'alpha_2': 5.100400428, 'm_break': 37.9806382, 'lam_0': 0.4206178692, 'lam_1': 0.5228817702, 'mpp_1': 9.989384122, 'sigpp_1': 0.6601839103, 'mpp_2': 33.2656028, 'sigpp_2': 4.582221363, 'delta_m': 3.123416382, 'beta': 0.8049660633}
redshift-parameters = {'gamma': 2.7, 'kappa': 5.6, 'z_peak': 1.9}
spin-parameters = {'mu_chi': 0.0751318233, 'sigma_chi': 0.3667469243, 'mu_t': 0.2788662234, 'sigma_t': 0.9661688072, 'xi_spin': 0.6650168221}
blocks = ['mass', 'redshift', 'spin']

[Fit]
fit-redshift = True
fit-mass = True
fit-spin = True

[Fisher]
; Three mass scales are set by construction and one hyper-parameter is pinned.
;
; mmin, m_high and maximum_mass are not hyper-parameters here at all -- they are
; hard cutoffs whose centred scores vanish identically, so they are set by
; construction in [Model]. See GWForge.population_fisher.model.
;
; delta_m is a hyper-parameter of the model but is held at its generation value.
; It is the width of the low-mass taper -- a sharp feature at a fixed
; source-frame mass, so a standard scale, and the mass parameter that feeds H0
; most directly. Freeing it lets the taper absorb the cosmology. Scan it by
; running the forecast at several values instead.
;
; m_break is free: also a mass scale, and correspondingly correlated, but a
; feature of the spectrum the catalogue genuinely constrains.
;
; Omitting a name here fixes it at its config value and the summary says so.
free-parameters = ['alpha_1', 'alpha_2', 'm_break', 'lam_0', 'lam_1', 'mpp_1', 'sigpp_1', 'mpp_2', 'sigpp_2', 'beta', 'gamma', 'kappa', 'z_peak', 'mu_chi', 'sigma_chi', 'mu_t', 'sigma_t', 'xi_spin']
score-method = analytic

[Output]
output-directory = pf_xg
label = mrs_xg
plot-corner = True
