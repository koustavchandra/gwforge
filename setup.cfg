[metadata]
name = gwforge
description = Tool for generating gravitational wave mock dataset
author = Koustav Chandra
author_email = koustav.chandra@aei.mpg.de
license = MIT
version = 0.0.dev1
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    License :: OSI Approved :: MIT License
    Operating System :: MacOS
    Operating System :: Unix
    Operating System :: POSIX :: Linux
    Programming Language :: Python :: 3.11
    Topic :: Scientific/Engineering :: Astronomy
    Topic :: Scientific/Engineering :: Physics
    Natural Language :: English
    Intended Audience :: Science/Research

[options]
packages = find:
install_requires = file: requirements.txt
python_requires = >=3.11

[options.extras_require]
# gwpopulation is no longer a runtime dependency: GWForge reimplements the
# smoothed mass models and redshift evolutions it used (see
# GWForge/population/_smoothed_mass.py). It is kept here as a *test-only*
# dependency so the regression tests can assert the reimplementations still
# match gwpopulation to numerical precision. Install with: pip install -e .[test]
test =
    pytest
    gwpopulation>=1.2.1
# gwfast is an *optional* cross-validation dependency: the regression test
# tests/test_antenna_response.py compares GWForge's frequency-dependent antenna
# response against GWFast's time-varying pattern functions. It pulls in JAX, so
# it is kept out of the core requirements.
# Install with: pip install -e .[validation]
validation =
    gwfast
# Extra waveform models exercised by tests/test_fisher_waveforms.py, which
# checks that the Fisher machinery is not quietly specialised to the
# aligned-spin, quasi-circular LAL waveforms it was validated against.
# pyseobnr provides SEOBNRv5HM/SEOBNRv5PHM through lalsimulation.gwsignal;
# pyEFPEHM is a precessing, eccentric, higher-mode inspiral installed from git
# (pip install git+https://github.com/gw-models/pyEFPEHM.git).
# Install with: pip install -e .[waveforms]
waveforms =
    pyseobnr

[options.package_data]
GWForge.population = population_configuration_files/*.ini
GWForge.inject = eos_tables/*.dat
GWForge.ifo = noise_curves/*.txt, network_configuration_files/*.ini, ifos/*.ifo